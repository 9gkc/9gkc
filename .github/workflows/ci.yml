name: Profile checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate profile README
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          grep -q "## About me" README.md
          grep -q "## Technical skills" README.md
          grep -q "## Projects" README.md
          grep -q "https://github.com/9gkc/Al-Kunooze-Security" README.md
          grep -q "https://github.com/9gkc/WiFiScan" README.md
          grep -q "https://github.com/9gkc/AtomicSite" README.md
          grep -q "https://github.com/9gkc/ShopFlow" README.md
          grep -q "https://github.com/9gkc/Bookmarker" README.md
          grep -q "https://github.com/9gkc/TicTacToe" README.md
          test "$(grep -o 'https://github.com/9gkc/[A-Za-z0-9._-]*' README.md | sort -u | wc -l)" -ge 12

      - name: Check Markdown structure
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'YOUR_USERNAME|<repository-url>|simple-ecommerce-cart|image-slider-thumbnails|tic-tac-toe-game' README.md
          ! grep -nE '<img[^>]*alt=""' README.md
          test "$(grep -c '^## ' README.md)" -ge 4
